<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PSRI CRM — Open Mind Services</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side routing — a hard refresh or direct link
      // to e.g. /crm-psri-testing/psri/cases requests a file that doesn't exist
      // and lands here. This encodes the intended path into a query string and
      // redirects to the real index.html, which decodes it (see index.html)
      // and hands off to React Router to restore the correct route.
      var pathSegmentsToKeep = 1; // the "/crm-psri-testing" segment

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
